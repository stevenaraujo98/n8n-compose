name: n8n-prod

services:
  traefik:
    image: traefik
    container_name: traefik
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--providers.file.filename=/traefik-certs.yml"
      - "--providers.file.watch=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/certs:ro
      - ./traefik-certs.yml:/traefik-certs.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - n8n_network

  redis:
    image: redis:8.8-alpine
    container_name: n8n_redis
    restart: always
    command:
      - redis-server
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    networks:
      - queue_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-password123}
      - MINIO_SERVER_URL=https://${MINIO_API_SUBDOMAIN}.${DOMAIN_NAME}
      - MINIO_BROWSER_REDIRECT_URL=https://${MINIO_CONSOLE_SUBDOMAIN}.${DOMAIN_NAME}
    volumes:
      - /minio-buckets:/data
    networks:
      - n8n_network
    ports:
      - "9001:9001"
      - "9000:9000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.minio-api.rule=Host(`${MINIO_API_SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.minio-api.entrypoints=websecure
      - traefik.http.routers.minio-api.tls=true
      - traefik.http.routers.minio-api.service=minio-api
      - traefik.http.services.minio-api.loadbalancer.server.port=9000
      - traefik.http.routers.minio-console.rule=Host(`${MINIO_CONSOLE_SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.minio-console.entrypoints=websecure
      - traefik.http.routers.minio-console.tls=true
      - traefik.http.routers.minio-console.service=minio-console
      - traefik.http.services.minio-console.loadbalancer.server.port=9001
      - traefik.docker.network=n8n-prod_n8n_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-setup:
    image: minio/mc
    container_name: minio_setup
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_N8N_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_N8N_SECRET_KEY: ${MINIO_SECRET_KEY}
    networks:
      - n8n_network
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing myminio/cdn-manifest;
      mc mb --ignore-existing myminio/artifacts-bak;
      printf '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::cdn-manifest/*\"]}]}' > /tmp/cdn-policy.json;
      mc anonymous set-json /tmp/cdn-policy.json myminio/cdn-manifest;
      mc anonymous set none myminio/artifacts-bak;
      mc admin user svcacct add myminio $${MINIO_ROOT_USER} --access-key $${MINIO_N8N_ACCESS_KEY} --secret-key $${MINIO_N8N_SECRET_KEY} || true;
      touch /tmp/.keep;
      mc cp /tmp/.keep myminio/cdn-manifest/assets/.keep;
      mc cp /tmp/.keep myminio/cdn-manifest/chat/.keep;
      mc cp /tmp/.keep myminio/cdn-manifest/public/.keep;
      mc cp /tmp/.keep myminio/artifacts-bak/backups/.keep;
      mc cp /tmp/.keep myminio/artifacts-bak/chat/.keep;
      mc cp /tmp/.keep myminio/artifacts-bak/private/.keep;
      echo 'Setup completado';
      "

  # ─── n8n MAIN ────────────────────────────────────────────────────────────────
  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: n8n
    restart: always
    expose:
      - "5678"
      - "5679"   # task broker port — accesible por los sidecars
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n-prod_n8n_network
      - traefik.http.services.n8n.loadbalancer.server.port=5678
      - traefik.http.routers.n8n.rule=Host(`${SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.entrypoints=websecure
      - traefik.http.middlewares.n8n.headers.SSLRedirect=true
      - traefik.http.middlewares.n8n.headers.STSSeconds=315360000
      - traefik.http.middlewares.n8n.headers.browserXSSFilter=true
      - traefik.http.middlewares.n8n.headers.contentTypeNosniff=true
      - traefik.http.middlewares.n8n.headers.forceSTSHeader=true
      - traefik.http.middlewares.n8n.headers.SSLHost=${DOMAIN_NAME}
      - traefik.http.middlewares.n8n.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.n8n.headers.STSPreload=true
      - traefik.http.routers.n8n.middlewares=n8n@docker
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - N8N_SECURE_COOKIE=true
      - N8N_PROXY_HOPS=1
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=saacdata
      - DB_POSTGRESDB_HOST=${POSTGRES_HOST}
      - DB_POSTGRESDB_PORT=5433
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_POSTGRESDB_SCHEMA=n8n
      - JAVA_HOME=/usr/lib/jvm/java-17-openjdk
      # Cola Redis
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
      # Task Runners — external mode (N8N_RUNNERS_ENABLED está deprecado, se activa automáticamente)
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_NATIVE_PYTHON_RUNNER=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files
    networks:
      - n8n_network
      - queue_network
    depends_on:
      redis:
        condition: service_healthy

  # ─── WORKER 1 ────────────────────────────────────────────────────────────────
  n8n-worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: n8n_worker_1
    restart: always
    command: ["worker", "--concurrency", "${N8N_WORKER_CONCURRENCY:-5}"]
    expose:
      - "5679"
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - NODE_ENV=production
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=saacdata
      - DB_POSTGRESDB_HOST=${POSTGRES_HOST}
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_POSTGRESDB_SCHEMA=n8n
      - JAVA_HOME=/usr/lib/jvm/java-17-openjdk
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
      - N8N_WORKER_MODE=true
      - OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_NATIVE_PYTHON_RUNNER=true
    volumes:
      - ./local-files:/files
    networks:
      - n8n_network
      - queue_network
    depends_on:
      redis:
        condition: service_healthy

  task-runners-worker-1:
    build:
      context: .
      dockerfile: Dockerfile.runners
    container_name: n8n_runners_worker_1
    restart: always
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n-worker-1:5679
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_MAX_CONCURRENCY=${N8N_WORKER_CONCURRENCY:-5}
      - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=0
    networks:
      - n8n_network
    depends_on:
      - n8n-worker-1

  # ─── WORKER 2 ────────────────────────────────────────────────────────────────
  # n8n-worker-2:
