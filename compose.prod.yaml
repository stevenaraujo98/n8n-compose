  #   restart: always
  #   environment:
  #     - N8N_RUNNERS_TASK_BROKER_URI=http://n8n-worker-2:5679
  #     - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
